    deliverables:
      create:
        - cmd/constitution/testdata/script/config_set_repair.txtar — end-to-end proof that a config broken in a settable key is repairable through the one supported writer
      modify:
        - "internal/config/config.go — split Load into `loadRaw` (read + unmarshal, no validation) and Load (loadRaw + validate); add `LoadLenient(path)` exposing loadRaw for the write path only"
        - "cmd/constitution/config.go — runConfigSet loads via LoadLenient; the pre-write whole-config Validate and the atomic write are untouched"
      test:
        - "cmd/constitution/config_test.go — TestConfigSetRepairsInvalidSettableKey, TestConfigSetStillRefusesAnInvalidResult, and the corruptConfigKey helper"
    contract:
      check: go build ./... && go vet ./... && golangci-lint run && go test ./...
      criteria:
