# yaml-language-server: $schema=https://raw.githubusercontent.com/kentra-io/milestoned-plan-dag/main/schema/plan.schema.json
#
# ═══════════════════════════════════════════════════════════════════════════
# Open-Issue Sweep — Implementation Plan
#
# For agentic workers: REQUIRED SUB-SKILL — use superpowers:subagent-driven-
# development (recommended) or superpowers:executing-plans to implement this
# plan milestone-by-milestone. Steps use checkbox (`[ ]`) syntax for tracking.
# Run `milestoned-plan-dag render <this file>` for a readable view.
#
# Goal: close every v0.3.0 dogfooding issue whose fix is unambiguous, without
# changing any decision that needs a human to make it.
#
# Architecture: nine independent, sequenced milestones over the existing
# layout — `internal/config` (schema + validation), `cmd/constitution`
# (the urfave/cli verb tree), `internal/guard` (git/manifest checking),
# `internal/render` (the deterministic projection) and `skills/` (the
# //go:embed-ed Layer-2 skills). Nothing is restructured: each milestone is
# a small, test-first change inside a file that already exists, except two
# new single-purpose files (internal/config/pattern.go, skillversion.go).
#
# Tech Stack: Go 1.25+/1.26, urfave/cli v3, go.yaml.in/yaml/v3,
# rogpeppe/go-internal/testscript (txtar e2e under
# cmd/constitution/testdata/script/), golangci-lint v2.12.2.
#
# Repo conventions this plan follows (from CLAUDE.md):
#   - Build smoke binaries to a scratch path and NEVER name one
#     `constitution` — the CLI creates a `constitution/` directory and the
#     names collide. `go build -o /tmp/adrc-test ./cmd/constitution`.
#   - Never hand-edit files under `constitution/adr/` or
#     `constitution/constitution.md` (generated — edit ADRs, run regen).
#   - `internal/render` goldens regenerate with `-update`; the cmd/ txtar
#     suite has NO -update flag and is edited by hand.
#   - Read a file before editing it.
#
# ═══════════════════════════════════════════════════════════════════════════
# ISSUE TRIAGE
#
# Every issue below was re-reproduced on HEAD (de00401 == v0.3.0 == the
# binary on PATH) on 2026-08-20 before this plan was written; none had been
# fixed since filing.
#
# Closes: #22, #23, #24, #25, #26, #30, #32.
# Advances but does NOT close: #27, #31.
# Untouched: #28, #29.
#
# The bar for inclusion is deliberately high: none of these defects is
# critical, and this plan is executed without human review of the diff. A fix
# is in only if its shape is forced by the code or stated outright by the
# issue. Anything that required PICKING between defensible designs was cut,
# even where the issue argued for one.
#
# WHAT WAS CUT, AND WHY
#
#   #29 draft `--source`      — EXCLUDED ENTIRELY. The issue offers three
#     (whole issue)             proposals and argues for the third (draft may
#                               omit `source`; `seal` enforces it). That is a
#                               deliberate change to the traceability
#                               contract of a governance tool, not a bug fix:
#                               it changes what `adr new` accepts and adds a
#                               new refusal to `seal`. It needs a human to
#                               choose. The workaround in the issue
#                               (sourceTracking.type generic) holds until
#                               then.
#
#   #28 project intro         — EXCLUDED ENTIRELY. Needs a design decision on
#     (whole issue)             where the intro comes from (a
#                               `purpose`-category rule, a config field, or a
#                               founding-interview section). The hardcoded
#                               `(architecture, mapping, testing, process)`
#                               parenthetical is knowingly left alone too, so
#                               the preamble is redesigned once rather than
#                               churned twice.
#
#   #31 the guardrail         — M7 ships only the issue's option 3 (document
#     (option 1)                the hazard in `--help` and in the skill).
#                               Option 1 (diff-and-confirm behind
#                               `--allow-rule-change`) would refuse an edit
#                               that succeeds today — a UX change with real
#                               design choices (flag name, refuse vs confirm,
#                               what counts as a change). #31 stays open for
#                               that call.
#
#   #27 governed-key repair   — M2 ships the issue's stated fix (load
#     (the other half)          leniently on the write path), which unfreezes
#                               `config set` for every SETTABLE key. It does
#                               not make an invalid `phase` or `categories`
#                               repairable: those are governed keys, and the
#                               pre-write whole-config Validate still
#                               correctly rejects the result. Whether
#                               `config set` should gain a narrow repair
#                               escape hatch for governed keys is policy.
#                               #27 stays open on that half.
#
#   #23 strictness at Load    — the issue's note proposes config.validate()
#                               as the home, then flags the consequence — an
#                               already-broken config would start failing at
#                               EVERY command — as "a behaviour change worth
#                               a deliberate decision". M3 avoids the
#                               decision entirely: the exported Validate() is
#                               called from exactly two places, both write
#                               paths (cmd/constitution/config.go:141 and
#                               cmd/constitution/init.go:232), while every
#                               read path goes through Load -> validate(path)
#                               (verified by grep, 2026-08-20). Putting the
#                               check in Validate() closes both halves of the
#                               issue's repro with no effect on any existing
#                               config. The late failure at `adr new` for a
#                               config that is ALREADY broken is left as-is.
#
#   #25 manifest fallback     — M5 ships the issue's second option (an
#                               actionable message), not the first (fall back
#                               to manifest-only). The fallback would turn a
#                               currently-failing guard into a passing one,
#                               which is a real behaviour change in CI; the
#                               message option keeps the exit code and fixes
#                               the actual complaint, which is that
#                               `fatal: bad revision 'HEAD'` reaches the user.
#
#   #24 deferred-ADR listing  — M6 ships only the pointer line, whose wording
#                               the empty projection already proves. Listing
#                               record-only ADRs under an "Open / deferred"
#                               heading, and the metadata-line styling
#                               remarks folded into the same issue, are
#                               design calls and stay unaddressed.
#
# LOCKED DECISIONS (so an implementer does not re-litigate them)
#
#   #22/#30 are ONE defect    — the same non-atomic init, filed twice from
#                               two angles. M4 closes both.
#
#   error text is frozen      — M1 switches phase/consent validation to map
#                               lookups but leaves both refusal messages
#                               byte-identical, so no test or txtar
#                               expectation changes. The drift #26 reports is
#                               in Schema(), not in the messages.
#
#   pointer placement         — M6 puts the decision-log line directly after
#                               the preamble, where the EMPTY projection
#                               already puts it, so both renders share one
#                               structure and the pointer cannot be pushed
#                               off-screen by a long rule list.
#
#   wrapped-vs-bare regexp    — #23 warns that validating a bare pattern
#                               while USING the wrapped `^(?:...)$` form lets
#                               the two disagree. They cannot actually
#                               disagree about *validity* (wrapping any valid
#                               regexp in a non-capturing group is always
#                               valid), so M3 does not test for a divergence
#                               that cannot exist. It removes the duplication
#                               instead — one WrapSourcePattern helper both
#                               sides call — so they cannot diverge in
#                               ANCHORING, which is the real risk.
#                               `source_rules.txtar` is the existing
#                               end-to-end guard on that behaviour.
#
#   fan-out refresh           — found while planning: this repo's OWN fanned
#                               skill copies are already stale
#                               (.claude/skills/adr-draft/SKILL.md is 10865
#                               bytes against skills/ at 11207 — nobody ran
#                               regen after the skills changed in feb1a0b,
#                               and .state records the stale hash so no drift
#                               is reported). It is a live instance of the
#                               #32 split-brain inside the primitive's own
#                               repo. M8 refreshes them with the sanctioned
#                               command and stops rather than forcing if
#                               drift is reported.
#
#   release shape             — 0.3.1. With #29 and #31's guardrail cut, this
#                               is a bugfix release plus one additive line in
#                               the projection. M8 bumps SkillsMinCLIVersion,
#                               .claude-plugin/plugin.json and
#                               lastSkillReleaseVersion together, in one
#                               milestone, so the suite is green at every
#                               milestone boundary. Cutting the tag,
#                               publishing the cask, and bumping the harness
#                               submodule + CONSTITUTION_VERSION are human
#                               acts OUTSIDE this plan and outside this
#                               repository.
#
#   no self-governance ADR    — code and docs only, following the precedent
#                               of the #18/#19/#20 plan. Nothing here changes
#                               a decision this repo's own log records, and
#                               constitution/adr/ is never written.
#
#   PR hygiene                — the PR body carries `Fixes #22`, `#23`,
#                               `#24`, `#25`, `#26`, `#30`, `#32`. #27 and
#                               #31 get a comment naming the half that
#                               shipped and the half left open; neither is
#                               closed.
#
# Ordering rationale (a sequential chain by design, not for lack of
# independence): the config milestones come first because they are pure and
# self-contained; init and guard behaviour follow; the projection change is
# late so its golden churn lands once, on top of every txtar the earlier
# milestones add; the two skills-text milestones are serialized because they
# edit the same SKILL.md files.
schemaVersion: 0.1.0

