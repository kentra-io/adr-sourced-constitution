        ```go
        	switch {
        	case validPhases[c.Phase]:
        	case c.Phase == "":
        		return fmt.Errorf(
        			"%s: field %q: required — add 'phase: sealed' for an existing (append-only) log, or 'phase: draft' for an unsealed one",
        			path, "phase",
        		)
        	default:
        		return fmt.Errorf(
        			"%s: field %q: must be %q or %q (got %q)",
