    steps:
      - |
        [ ] **Step 1: Write the failing tests**

        Append to `cmd/constitution/config_test.go`. `setupRepo`, `runCLI`,
        `mustReadFile` and `mustWriteFile` are the package's existing helpers
        (defined in `new_test.go`):

        ```go
        // corruptConfigKey rewrites one line of the constitution.yml
        // setupRepo wrote, so a test can start from a config that fails
        // validation exactly the way a hand-edit breaks it.
        func corruptConfigKey(t *testing.T, oldLine, newLine string) {
        	t.Helper()
        	before := mustReadFile(t, "constitution.yml")
        	after := strings.Replace(before, oldLine, newLine, 1)
        	if after == before {
        		t.Fatalf("corruptConfigKey: %q not found in constitution.yml:\n%s", oldLine, before)
        	}
        	mustWriteFile(t, "constitution.yml", after)
        }

        // TestConfigSetRepairsInvalidSettableKey is issue #27's core case:
        // config set validated the WHOLE config before applying anything, so
        // it refused to operate on any file that failed validation —
        // including when the invalid value was the very key being set. The
        // skills forbid hand-editing constitution.yml, so that left an agent
        // with no recovery path at all.
        func TestConfigSetRepairsInvalidSettableKey(t *testing.T) {
        	setupRepo(t, "off", "architecture")
        	corruptConfigKey(t, "  policy: off", "  policy: stricter")

        	if err := runCLI(t, "config", "set", "consent.policy", "off"); err != nil {
        		t.Fatalf("config set(consent.policy, off) against a config broken in that same key = %v, want nil", err)
        	}

        	cfg, err := config.Load("constitution.yml")
        	if err != nil {
        		t.Fatalf("reload after repair: %v", err)
        	}
        	if cfg.Consent.Policy != config.ConsentOff {
        		t.Errorf("Consent.Policy = %q, want %q", cfg.Consent.Policy, config.ConsentOff)
        	}
        }

        // TestConfigSetStillRefusesAnInvalidResult is the control: relaxing
        // the pre-READ gate must not relax the pre-WRITE one. An illegal
        // result is still refused, and constitution.yml is untouched.
        func TestConfigSetStillRefusesAnInvalidResult(t *testing.T) {
        	setupRepo(t, "off", "architecture")
        	before := mustReadFile(t, "constitution.yml")

        	err := runCLI(t, "config", "set", "consent.policy", "maybe")
        	if err == nil {
        		t.Fatal("config set(consent.policy, maybe) = nil, want the illegal value refused")
        	}
        	if got := exitCode(err); got != 2 {
        		t.Errorf("exitCode = %d, want 2", got)
        	}
        	if after := mustReadFile(t, "constitution.yml"); after != before {
        		t.Errorf("constitution.yml changed despite the refusal:\nbefore: %s\nafter:  %s", before, after)
        	}
        }
        ```
      - |
        [ ] **Step 2: Run them and watch the first fail**

        Run: `go test ./cmd/constitution -run 'TestConfigSet(Repairs|StillRefuses)' -v`

        Expected: `TestConfigSetRepairsInvalidSettableKey` FAILS with
        `config set(consent.policy, off) ... = constitution.yml: field
        "consent.policy": must be "strict" or "off" (got "stricter")` —
        the refusal comes from the LOAD, before the key is even applied.
        `TestConfigSetStillRefusesAnInvalidResult` passes already; it is the
        regression guard for the next step.
      - |
        [ ] **Step 3: Split Load and add LoadLenient**

        In `internal/config/config.go`, replace `Load` with:

        ```go
        // Load reads and validates constitution.yml at path.
        func Load(path string) (*Config, error) {
        	cfg, err := loadRaw(path)
        	if err != nil {
        		return nil, err
        	}
        	if err := cfg.validate(path); err != nil {
        		return nil, err
        	}
        	return cfg, nil
        }

        // LoadLenient reads constitution.yml at path WITHOUT validating it.
        //
        // It exists for ONE caller — `constitution config set` (issue #27) —
        // and every read path must keep using Load. The guarantee that
        // matters is that an invalid config is never WRITTEN, which config
        // set still enforces by validating the whole result before its
        // atomic write; the guarantee that backfired is that an invalid
        // config could never be EDITED, which froze the one supported writer
        // against exactly the files needing repair.
        //
        // Note the defaulting difference: validate applies the
        // consent.policy/sourceTracking.type defaults as a side effect, so a
        // LoadLenient'd Config carries raw zero values until the caller's own
        // Validate() runs.
        func LoadLenient(path string) (*Config, error) {
        	return loadRaw(path)
        }

        // loadRaw reads and unmarshals constitution.yml at path, applying no
        // validation and no defaulting. Shared by Load and LoadLenient so
        // the two cannot drift in how the file is read.
        func loadRaw(path string) (*Config, error) {
        	data, err := os.ReadFile(path)
        	if err != nil {
        		return nil, err
        	}

        	var cfg Config
        	if err := yaml.Unmarshal(data, &cfg); err != nil {
        		return nil, fmt.Errorf("%s: not valid YAML: %w", path, err)
        	}
        	return &cfg, nil
        }
        ```
      - |
        [ ] **Step 4: Point runConfigSet at it**

        In `cmd/constitution/config.go`, in `runConfigSet` (~line 115),
