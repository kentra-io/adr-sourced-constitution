    slug: config-enum-vocabularies
    goal: "Derive every enumerated config vocabulary from the map the validator enforces, so Schema() cannot drift (#26)"
    deliverables:
      modify:
        - "internal/config/config.go — add `validPhases` and `validConsentPolicies` (map[string]bool, the shape the three existing vocabulary maps already use) and switch validate's two direct-comparison branches to map lookups. Both refusal messages keep their current wording verbatim"
        - "internal/config/schema.go — `phase` and `consent.policy` take `Values: sortedKeys(validPhases)` / `sortedKeys(validConsentPolicies)`; the schema.go:19-22 comment documenting the asymmetry is deleted"
      test:
        - "internal/config/schema_test.go — TestSchemaEnumValuesAreDerivedFromValidators: the structural guard that fails when Schema() and a validator map disagree"
    contract:
      check: go build ./... && go vet ./... && golangci-lint run && go test ./...
      criteria:
        - name: internal/config/schema_test.go::TestSchemaEnumValuesAreDerivedFromValidators
          given: each of the five enumerated config fields and the validator map that governs it
          when: Schema()'s Values for that field is compared against sortedKeys of that map
          then: the two are identical for every field, so a value added to a validator map reaches `config schema` with no second edit — the structural guard #17 taught, not a restatement of the same literal list
        - name: internal/config/config_test.go::TestValidateRejectsIllegalValue
          given: the existing validation tests and the whole txtar corpus
          when: they run against the map-lookup implementation
          then: they pass unchanged, because no error string moved — this milestone changes how the check is performed, not what the user sees
      paths:
        - internal/config/**
    steps:
      - |
        [ ] **Step 1: Write the failing test**

        Append to `internal/config/schema_test.go` (it already has the
        `fieldByKey` helper this uses):

        ```go
        // TestSchemaEnumValuesAreDerivedFromValidators is issue #26's
        // regression guard. Schema() must not RE-LIST any enumerated
        // vocabulary: every Values list has to come from the same map
        // validate enforces, so adding a value in one place cannot leave the
        // other stale. The check is structural (Values == sortedKeys(map)),
        // not a restatement of the same literals in a test file — #17's
        // lesson was that a literal list in a test proves nothing.
        func TestSchemaEnumValuesAreDerivedFromValidators(t *testing.T) {
        	tests := []struct {
        		key   string
        		vocab map[string]bool
        	}{
        		{"agentInstructions.targets", validTargets},
        		{"consent.policy", validConsentPolicies},
        		{"sourceTracking.type", validSourceTrackingTypes},
        		{"phase", validPhases},
        		{"skills.trees", validSkillTrees},
        	}

        	for _, tt := range tests {
        		t.Run(tt.key, func(t *testing.T) {
        			f := fieldByKey(t, tt.key)
        			want := sortedKeys(tt.vocab)
        			if len(f.Values) != len(want) {
        				t.Fatalf("Schema() %s Values = %v, want %v (derived from the validator map)",
        					tt.key, f.Values, want)
        			}
        			for i := range want {
        				if f.Values[i] != want[i] {
        					t.Errorf("Schema() %s Values[%d] = %q, want %q", tt.key, i, f.Values[i], want[i])
        				}
        			}
        		})
        	}
        }
        ```
      - |
        [ ] **Step 2: Run it and watch it fail**

        Run: `go test ./internal/config -run TestSchemaEnumValuesAreDerivedFromValidators`

        Expected: a COMPILE failure — `undefined: validConsentPolicies` and
        `undefined: validPhases`. Those maps are what this milestone adds; the
        test naming them is what forces them into existence.
      - |
        [ ] **Step 3: Add the two vocabulary maps**

        In `internal/config/config.go`, directly after the existing
        `validSkillTrees` block (~line 124):

        ```go
        var validPhases = map[string]bool{
        	PhaseDraft:  true,
        	PhaseSealed: true,
        }

        var validConsentPolicies = map[string]bool{
        	ConsentStrict: true,
        	ConsentOff:    true,
