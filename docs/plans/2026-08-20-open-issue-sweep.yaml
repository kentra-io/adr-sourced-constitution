          when: "`constitution config set consent.policy off` runs"
          then: it exits 0 and the config on disk is valid again — the one supported writer is usable on exactly the files that need repair
        - name: cmd/constitution/config_test.go::TestConfigSetStillRefusesAnInvalidResult
          given: a valid constitution.yml
          when: "`constitution config set consent.policy maybe` runs"
          then: it exits 2 and constitution.yml is byte-identical to before, proving the relaxed pre-read gate did not relax the pre-write one
        - name: cmd/constitution/testdata/script/config_set_repair.txtar
          given: a repo whose constitution.yml carries an illegal consent.policy, so ordinary read-path commands refuse it
          when: "`constitution config set consent.policy off` runs, then `constitution guard`"
