name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      # -race only on the ubuntu/1.26 leg: the data-race detector needs cgo +
      # a C toolchain, is slowest there, and one representative leg is enough
      # coverage for our (mostly pure, filesystem-serial) code. The other legs
      # run the same tests without it.
      - name: test
        shell: bash
        run: |
          flags=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.go }}" = "1.26.x" ]; then
            flags="-race"
          fi
          go test $flags ./... -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Lint tracks the newest toolchain only; the test matrix owns 1.25-floor compatibility.
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Validate .goreleaser.yaml at PR time so a broken release config is caught
  # before a tag ever runs release.yml. `goreleaser check` is config-only (no
  # build/publish); the pinned `version: "~> v2"` matches release.yml. Required
  # (not continue-on-error): config validity is binary.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # This repo governs itself (dogfood, implementation-plan.md §2.11): its own
  # constitution/ log is guarded here. ADVISORY (continue-on-error) exactly as
  # docs/ci-guard-example.yml prescribes — surfaces out-of-band mutation of the
  # log for a human to honor; not a required check in v1 (spec §5.4 Phase 1).
  guard:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base needs full history (see docs/ci-guard-example.yml)
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      # Build the CLI from this repo's own source to a temp path. It must NOT be
      # named "constitution": that would collide with the constitution/ directory.
      - name: build constitution
        run: go build -o "$RUNNER_TEMP/constitution" ./cmd/constitution
      - name: guard the ADR log
        shell: bash
        run: |
          bin="$RUNNER_TEMP/constitution"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff the PR against the fork point, computed locally — never trust
            # the PR-supplied base SHA (docs/ci-guard-example.yml note 2).
            "$bin" guard --merge-base "origin/${{ github.base_ref }}" --format text
          else
            "$bin" guard --format text
          fi
